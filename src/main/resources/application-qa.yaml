spring:
  datasource:
    url: ${QA_DB_URL}
    username: ${QA_DB_USERNAME}
    password: ${QA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.examen.productos: INFO
    root: INFO
